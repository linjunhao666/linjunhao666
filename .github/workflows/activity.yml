name: Update 31-day Activity Graph
on:
  schedule:
    - cron: '23 19 * * *' # 03:23 Asia/Shanghai
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/activity.yml', '.github/scripts/activity.cjs']
permissions:
  contents: write
concurrency:
  group: profile-activity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Fetch the original Activity Graph renderer
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Ashutosh00710/github-readme-activity-graph
          ref: 0962e9461de815933d462e8b98c7ce566cada8fb
          path: .upstream/activity
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install renderer dependencies
        working-directory: .upstream/activity
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Render both themes
        run: node .github/scripts/activity.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
      - name: Verify and publish graphs
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for mode in ('dark', 'light'):
              svg = ET.parse(f'assets/activity-{mode}.svg').getroot()
              assert svg.attrib['viewBox'] == '0 0 900 230'
              assert len([x for x in svg.iter() if 'ct-point' in x.attrib.get('class', '').split()]) == 31
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity-dark.svg assets/activity-light.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update 31-day Activity Graph'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
