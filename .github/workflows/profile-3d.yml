name: Update 3D contribution calendar

on:
  schedule:
    - cron: '23 19 * * *' # 03:23 Asia/Shanghai
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/profile-3d.yml'
      - '.github/profile-3d-settings.json'
      - '.github/scripts/calendar-only.py'

permissions:
  contents: write

concurrency:
  group: profile-3d-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Generate light and dark calendars
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json
      - name: Keep only the 3D contribution calendar
        run: python3 .github/scripts/calendar-only.py
      - name: Commit updated calendars
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile-3d-contrib/profile-dark.svg profile-3d-contrib/profile-light.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update 3D contribution calendars'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
