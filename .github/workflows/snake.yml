name: Update Contribution Snake

on:
  schedule:
    - cron: '23 19 * * *' # Daily at 03:23 Asia/Shanghai
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: write

concurrency:
  group: contribution-snake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Generate light and dark snakes
        uses: Platane/snk/svg-only@a69d1dbca7a94c2ef0edf10dcd9e19982d74dd39 # v3.3.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg?color_snake=#7560a8&color_dots=#edf0f5,#d4cbea,#b0a0d0,#8c79b7,#4b9eac
            assets/snake-dark.svg?palette=github-dark&color_snake=#82c8d2&color_dots=#202735,#39314e,#5b477e,#8c76b8,#509ba9
      - name: Verify generated SVGs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for mode in ('light', 'dark'):
              path = Path(f'assets/snake-{mode}.svg')
              svg = ET.parse(path).getroot()
              assert svg.tag == '{http://www.w3.org/2000/svg}svg'
              assert '@keyframes' in path.read_text(), 'Missing snake animation'
          PY
      - name: Publish updated snakes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/snake-light.svg assets/snake-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update Contribution Snake animations'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
